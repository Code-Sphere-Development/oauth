name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neue Pushes auf denselben Ref brechen laufende Jobs ab (nicht auf main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. composer.json, Code-Style (Pint) und statische Analyse (Larastan)
  # ---------------------------------------------------------------------------
  static:
    name: Pint & PHPStan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # ---------------------------------------------------------------------------
  # 2. Pest gegen alle unterstuetzten PHP- und Laravel-Versionen
  #    (das Paket hat kein composer.lock, jede Kombination wird frisch aufgeloest)
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 setzt PHP 8.3 voraus.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-composer-

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev --no-update --no-interaction "laravel/framework:^${{ matrix.laravel }}.0"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pest
        run: vendor/bin/pest --colors=always
